# One entry per work area. The id (cloud, security, ai, data, web, automation)
# must match src/lib/categories.ts; it links the hero node to its row here.
# proofProjects are file names from src/content/projects (without extension).

- id: cloud
  name: Cloud & DevOps
  summary: AWS and Azure setups written as code, deployed by pipelines and watched by alarms.
  tooltip: Moving apps onto AWS and Azure, with pipelines, infrastructure as code and alerts.
  deliverables:
    - Migrations from a VPS or another cloud to AWS and Azure
    - CI/CD pipelines with per-environment config
    - Infrastructure as code in Terraform and Pulumi
    - Windows Server, IIS and .NET hosting
    - Backups and disaster recovery
    - Monitoring, alerting and cost reviews
    - CDN and DNS on Akamai and Cloudflare
  tools:
    - AWS (VPC, EC2, RDS, S3, CodePipeline, CodeBuild, CodeDeploy, CloudWatch, SNS, Parameter Store, KMS, Route 53)
    - Azure (Key Vault, Entra ID, Container Apps)
    - GCP (IAM, org policies)
    - Terraform
    - Pulumi
  proofProjects:
    - vps-to-aws-migration
    - ideali-cloud-operations

