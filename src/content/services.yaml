- id: security
  name: Security
  summary: Defence-in-depth for web apps and cloud estates, from identity and secrets to hardened infrastructure and security checks built into every pipeline.
  tooltip: Identity, secrets, cloud hardening and DevSecOps.
  deliverables:
    - Authentication and authorisation with OAuth 2.0, OpenID Connect and JWT
    - SSO with SAML and Entra ID, plus SCIM user provisioning
    - Role-based access control and least-privilege IAM policies
    - Centralised secrets management with rotation, no secrets in code
    - Encryption at rest and in transit with KMS-managed keys and TLS
    - DevSecOps in CI/CD with dependency, container image and secret scanning
    - Web application hardening against the OWASP Top 10, with WAF and rate limiting
    - Security headers, CSP and TLS fixes after OWASP ZAP scans
    - Audit logging and alerting for suspicious activity
  tools:
    - Entra ID
    - AWS IAM
    - AWS KMS
    - AWS WAF
    - AWS Parameter Store
    - Azure Key Vault
    - OWASP ZAP
    - GitHub Dependabot
    - Trivy
    - Cloudflare
  proofProjects:
    - key-vault-access
    - ideali-cloud-operations

