# One entry per work area. The id (web, cloud, ai, data, security, automation)
# must match src/lib/categories.ts; it links the hero node to its row here.
# proofProjects are file names from src/content/projects (without extension).

- id: web
  name: Full-Stack Development
  summary: Web apps and APIs built end to end, from React and Angular front ends to .NET, Node, Python and Java back ends.
  tooltip: Full-stack web apps and APIs in .NET, Node, Python and Java with React and Angular.
  deliverables:
    - Web apps and SaaS platforms, from first design to production
    - REST APIs and microservices in .NET, Node.js, Python and Java
    - Front ends in React, Next.js and Angular
    - Progressive Web Apps with offline support
    - Third-party and hardware integrations (SAP, RFID, payments)
    - Clean Architecture and Domain-Driven Design
    - Modernising legacy .NET applications
  tools:
    - .NET / C# (ASP.NET Core)
    - Node.js / Express
    - Python (FastAPI, Django)
    - Java (Spring Boot)
    - React
    - Next.js
    - Angular
    - TypeScript
  proofProjects:
    - codeon
    - ar-try-on

