# "How I work": a real sequence of steps, in order.
# Six steps fill the wide layout: two rows of three (1-2-3, then 6-5-4 back).
# Any other count falls back to a single stacked column.
# phase: set on the first step of each phase; shown as "Phase 1 · Plan & build".
# Titles use the terms people search for; bodies name real tools and stay one
# to two sentences.
# outcome: what the client has at the end of the step, shown as a chip.

- id: discovery
  phase: Plan & build
  order: 1
  title: Discovery
  body: We talk through your product, users and goals, and I review any existing code, infrastructure and integrations to find what to keep and what to fix.
  outcome: Clear requirements

- id: plan
  order: 2
  title: Architecture and estimate
  body: You get a written plan covering the tech stack, data model, architecture, risks and an estimate, agreed before any work starts.
  outcome: Written plan + estimate

- id: build
  order: 3
  title: Full-stack development
  body: I build the front end, API and database in short iterations, with code reviews, automated tests and a demo you can try at the end of every sprint.
  outcome: Working software

- id: deploy
  phase: Launch & support
  order: 4
  title: Deploy and go live
  body: The app ships in Docker through CI/CD pipelines, with infrastructure written in Terraform, Pulumi or AWS CDK, and monitoring in place before launch.
  outcome: Live on AWS or Azure

- id: handover
  order: 5
  title: Handover and documentation
  body: You get the source code, documentation, runbooks and full access to your own repositories and cloud accounts, so your team owns everything from day one.
  outcome: Code + docs

- id: support
  order: 6
  title: Post-launch support
  body: For 30 days after launch I'm on hand to fix issues, ship small improvements and answer your team's questions.
  outcome: 30 days of support
