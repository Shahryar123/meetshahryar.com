# "How I work": a real sequence of steps, in order.
# Six steps fill the wide layout: two rows of three (1-2-3, then 6-5-4 back).
# Any other count falls back to a single stacked column.
# phase: set on the first step of each phase; shown as "Phase 1 · Plan & build".
# Titles use the terms people search for; bodies name real tools and stay one
# to two sentences.
# outcome: what the client has at the end of the step, shown as a chip.

- id: audit
  phase: Plan & build
  order: 1
  title: Infrastructure audit
  body: I review how your application is built, deployed, monitored and secured on AWS, Azure or your current server, and find what slows releases or risks uptime.
  outcome: Findings

- id: plan
  order: 2
  title: Plan and estimate
  body: You get a written plan covering architecture, security, risks and estimated cloud costs, agreed before any work starts.
  outcome: Written plan + costs

- id: build
  order: 3
  title: Infrastructure as code
  body: I write the infrastructure in Terraform or Pulumi and build CI/CD pipelines in GitHub Actions or Azure DevOps, so every change is reviewed and repeatable.
  outcome: Terraform + pipelines

- id: migrate
  phase: Launch & support
  order: 4
  title: Migrate and go live
  body: Monitoring, alerting and backups are in place before traffic moves, and every cut-over has a tested rollback plan to keep downtime to a minimum.
  outcome: Live, with rollback

- id: handover
  order: 5
  title: Handover and documentation
  body: You get documentation, runbooks, dashboards and full access to your own cloud accounts, so your team owns the setup from day one.
  outcome: Docs + runbooks

- id: support
  order: 6
  title: Post-launch support
  body: For 30 days after go-live I'm on hand to fix issues and answer your team's questions while the new setup settles in.
  outcome: 30 days of support
