# Questions clients ask, phrased the way people search for them.
# Keep each answer to two or three sentences (about 30-55 words): the answer
# card sizes itself to the longest one. Answers in "[brackets]" are TODOs and
# are left out of the FAQ structured data until they're filled in.

- id: engagement
  order: 1
  question: How can I hire you for a DevOps or cloud project?
  answer: You can hire me for a fixed-price project with an agreed scope, on an hourly basis for smaller or open-ended tasks, or on a monthly retainer for ongoing DevOps, cloud operations and support. Most projects start with a short infrastructure audit, so the scope is based on your real setup.

- id: international
  order: 2
  question: Do you work with international clients?
  answer: Yes. I've worked remotely with clients in the UK, Ireland, the UAE, Saudi Arabia, Canada and Australia. Calls, documentation and handover are in English, and your infrastructure always stays in your own AWS or Azure accounts.

- id: time-zones
  order: 3
  question: Which time zones do you cover?
  answer: I'm based in Karachi, Pakistan (UTC+5). Working hours in the UAE and Saudi Arabia overlap almost completely with mine, and UK and Irish mornings fall in my afternoon. For Canada and Australia, we agree on a regular window for calls, and the rest of the work runs asynchronously.

- id: cost
  order: 4
  question: How much does a cloud migration or DevOps project cost?
  answer: It depends on the size of your setup and what needs to change. After the infrastructure audit, you get a written estimate covering my fees and your expected monthly cloud costs, so there are no surprises before work starts.

- id: response-time
  order: 5
  question: How quickly do you respond to enquiries?
  answer: I reply to new enquiries within one working day. During a project, you get regular written updates on progress, blockers and next steps.

- id: nda
  order: 6
  question: Will you sign an NDA and keep our data secure?
  answer: Yes. I'm happy to sign your NDA before you share any details. I work with least-privilege access, keep secrets out of code and chat, and remove my access when the project ends.
